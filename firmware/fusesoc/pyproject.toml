[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qick"
version = "0.0.1"
description = "QICK FuseSoC environment"
dependencies = [
    "fusesoc==2.4.3",
    "edalize==0.6.1",
    "jinja2",
    "pytest==7.2.0",
    "peakrdl>=0.6.0",
    "systemrdl-compiler",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["scripts"]
markers = [
    "svunit_test: RTL testbenches run via SVUnit + simulator",
]